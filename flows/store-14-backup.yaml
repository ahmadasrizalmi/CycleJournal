steps:
  - echo: 'Settings, backup button opening the backup method dialog'
  - launch: com.app.cyclejournal
  - wait: 10000
  - await:
      idle: true
  - tap:
      id: nav_settings
  - wait: 2500
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.80
      toX: 0.5
      toY: 0.50
      durationMs: 600
  - wait: 900
  - tap:
      id: settings_backup
  - wait: 2500
  - await:
      idle: true
